name: Build and Release APWorld

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v0.2.1)'
        required: false
        default: 'v0.2.1'

permissions:
  contents: write

jobs:
  build-apworld:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare APWorld files
        run: |
          mkdir -p supermarket_simulator
          cp -r apworld/supermarket_simulator/* supermarket_simulator/

      - name: Zip APWorld
        run: |
          zip -r supermarket_simulator.apworld supermarket_simulator

      - name: Upload APWorld to Release
        uses: softprops/action-gh-release@v2
        with:
          files: supermarket_simulator.apworld
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
